<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CG &amp; creative pro, 5 yrs, combining 3D and AI for results you can rely on. Open to collabs!"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Valentin Vitvinskii" />
    <meta property="og:title" content="Valentin Vitvinskii • CG / AI / artdir" />
    <meta
      property="og:description"
      content="CG &amp; creative pro, 5 yrs, combining 3D and AI for results you can rely on. Open to collabs!"
    />
    <meta property="og:url" content="https://v-e-v.org/" />
    <meta property="og:image" content="https://v-e-v.org/icons/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Valentin Vitvinskii • CG / AI / artdir" />
    <meta
      name="twitter:description"
      content="CG &amp; creative pro, 5 yrs, combining 3D and AI for results you can rely on. Open to collabs!"
    />
    <meta name="twitter:image" content="https://v-e-v.org/icons/og-image.jpg" />
    <title>Valentin Vitvinskii</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="./icons/favicon.jpg" />
  </head>
  <body>
    <div class="loading-screen" id="loading-screen">
      <span class="loading-counter" id="loading-counter">0%</span>
    </div>

    <header class="site-header">
      <nav class="tabs" aria-label="Main sections">
        <button class="tab is-active mobile-copyright" data-tab="projects" type="button">VALENTIN VITVINSKII &copy; 2026</button>
        <button class="tab portrait-tab" data-tab="about" type="button">about</button>
        <button class="tab portrait-tab" data-tab="contact" type="button">contact</button>
      </nav>
    </header>

    <main class="tab-panels">
      <section class="panel is-active" data-panel="projects" aria-labelledby="projects-tab">
        <div class="head-stage" id="head-stage" aria-label="3D animated head"></div>
        <div class="head-meta" id="head-meta" aria-live="polite">
          <span class="head-meta-name" id="head-meta-name"></span>
          <span class="head-meta-tags" id="head-meta-tags"></span>
        </div>
        <div class="tiles-orbit" id="tiles-orbit" aria-label="Project cards in semicircle"></div>
      </section>

      <section class="panel" data-panel="index">
        <ul class="projects-list" id="projects-list"></ul>
      </section>

      <section class="panel" data-panel="about">
        <div class="mobile-info" id="mobile-about-content"></div>
      </section>

      <section class="panel" data-panel="contact">
        <div class="mobile-info" id="mobile-contact-content"></div>
      </section>

      <section class="panel detail-panel" data-panel="detail">
        <div class="detail-scroll">
          <div class="detail-blocks">
            <div class="detail-block">
              <p class="eyebrow" id="detail-index"></p>
              <div class="detail-title-row">
                <h3 id="detail-title"></h3>
                <span class="detail-tags" id="detail-tags"></span>
              </div>
              <p id="detail-description"></p>
            </div>
          </div>
          <div class="detail-media-wrap">
            <div class="detail-media" id="detail-media"></div>
            <div class="detail-video-controls" id="detail-video-controls" style="display:none">
              <button class="detail-video-btn" id="detail-video-play" type="button" aria-label="Play">
                <img id="detail-play-icon" src="./icons/play.svg" alt="" width="18" height="18">
                <img id="detail-pause-icon" src="./icons/pause.svg" alt="" width="18" height="18" style="display:none">
              </button>
              <button class="detail-video-btn" id="detail-video-fullscreen" type="button" aria-label="Fullscreen">
                <img src="./icons/fullscreen.svg" alt="" width="16" height="16">
              </button>
            </div>
          </div>
          <div class="detail-credits" id="detail-credits">
            <div class="detail-links" id="detail-links"></div>
            <div class="detail-roles" id="detail-roles"></div>
          </div>
        </div>
        <button class="detail-back" type="button" id="detail-back" aria-label="Back">back</button>
        <div class="detail-nav">
          <button class="detail-nav-btn" type="button" id="detail-prev" aria-label="Previous">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 3L5 7l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span>prev</span>
          </button>
          <button class="detail-nav-btn" type="button" id="detail-next" aria-label="Next">
            <span>next</span>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
      </section>
    </main>

    <div class="reveal-overlay" id="reveal-overlay">
      <img class="reveal-image" id="reveal-image" src="" alt="" />
    </div>

    <aside class="info-side-panel" id="info-side-panel" aria-label="Side info panel">
      <div class="side-panel-top"></div>
      <div class="side-panel-bottom"></div>
    </aside>

    <div class="view-switch" role="group" aria-label="Display mode">
      <button class="slider-toggle" type="button" id="view-toggle">
        <span class="slider-option" data-view="projects">
          <svg role="img" aria-label="Overview" width="22" height="22" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21,15L21,57C21,60.314 23.686,63 27,63L45,63C48.314,63 51,60.314 51,57L51,15C51,11.686 48.314,9 45,9L27,9C23.686,9 21,11.686 21,15Z"/>
              <path transform="matrix(1,0,0,1,41.948595,-0.284678)" d="M27,18.11C23.686,18.11 21,20.796 21,24.11L21,48.46C21,51.773 23.686,54.46 27,54.46"/>
              <path transform="matrix(-1,0,0,1,30.618779,-0.284678)" d="M27,18.11C23.686,18.11 21,20.796 21,24.11L21,48.46C21,51.773 23.686,54.46 27,54.46"/>
            </g>
          </svg>
        </span>
        <span class="slider-option" data-view="index">
          <svg role="img" aria-label="Index" width="22" height="22" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M27 51H60M27 36H60M27 21H60M12 49.5H15V52.5H12V49.5ZM12 34.5H15V37.5H12V34.5ZM12 19.5V22.5H15V19.5H12Z" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="slider-knob"></span>
      </button>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.168.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.168.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
